[package]
name = "rust-music"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = { version = "0.32", default-features = false }
lofty = "0.25"
libloading = "0.8"
walkdir = "2"
encoding_rs = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
ureq = "2"
flate2 = "1"
md5 = "0.7"
base64 = "0.22"
# 全局热键（↑↓ 音量、←→ 切歌）。Linux/X11 走 XGrabKey，和 txt-reader 同款方案。
global-hotkey = "0.6"

[target.'cfg(windows)'.dependencies]
rfd = "0.15"
# 桌面歌词窗改用 Win32 分层窗口（UpdateLayeredWindow）自绘，
# 不再依赖 OpenGL 帧缓冲的 alpha（远程桌面/虚拟显卡上经常拿不到）
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
